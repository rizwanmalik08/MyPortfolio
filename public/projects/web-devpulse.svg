<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="dpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#dpBg)"/>

  <!-- Browser Header -->
  <rect width="1200" height="50" fill="#0b0f19"/>
  <circle cx="35" cy="25" r="6" fill="#ef4444"/>
  <circle cx="55" cy="25" r="6" fill="#f59e0b"/>
  <circle cx="75" cy="25" r="6" fill="#10b981"/>
  <rect x="140" y="12" width="600" height="26" rx="6" fill="#1e293b"/>
  <text x="160" y="29" fill="#94a3b8" font-family="monospace" font-size="12">https://devpulse-analytics.io/dashboard</text>
  <rect x="1060" y="13" width="95" height="24" rx="12" fill="#0284c7"/>
  <text x="1076" y="29" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">LIVE SAAS</text>

  <!-- Sidebar -->
  <rect x="0" y="50" width="220" height="700" fill="#0e1322" stroke="#1f293d" stroke-width="1"/>
  <text x="35" y="105" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="20">⚡ DevPulse</text>
  
  <rect x="20" y="140" width="180" height="40" rx="10" fill="#8b5cf6" fill-opacity="0.2"/>
  <text x="50" y="165" fill="#c4b5fd" font-family="sans-serif" font-size="13" font-weight="bold">📊 Overview</text>
  <text x="50" y="210" fill="#64748b" font-family="sans-serif" font-size="13">📈 Performance</text>
  <text x="50" y="255" fill="#64748b" font-family="sans-serif" font-size="13">👥 Users &amp; Retention</text>
  <text x="50" y="300" fill="#64748b" font-family="sans-serif" font-size="13">⚙️ System Logs</text>
  <text x="50" y="345" fill="#64748b" font-family="sans-serif" font-size="13">🛡️ Security API</text>

  <!-- Main Content Area -->
  <g transform="translate(250, 70)">
    <!-- Top Welcome Banner -->
    <text x="0" y="35" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold">System Performance &amp; Metrics</text>
    <text x="0" y="60" fill="#64748b" font-family="sans-serif" font-size="13">Real-time throughput analytics powered by React &amp; Tailwind</text>

    <!-- 3 Stat KPI Cards -->
    <rect x="0" y="85" width="280" height="110" rx="14" fill="#13192b" stroke="#1e293b" stroke-width="1"/>
    <text x="25" y="120" fill="#94a3b8" font-family="sans-serif" font-size="12">TOTAL API CALLS</text>
    <text x="25" y="160" fill="#ffffff" font-family="sans-serif" font-size="30" font-weight="900">48.2M</text>
    <text x="200" y="155" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold">+28.4% ↑</text>

    <rect x="305" y="85" width="280" height="110" rx="14" fill="#13192b" stroke="#1e293b" stroke-width="1"/>
    <text x="330" y="120" fill="#94a3b8" font-family="sans-serif" font-size="12">AVG RESPONSE TIME</text>
    <text x="330" y="160" fill="#38bdf8" font-family="sans-serif" font-size="30" font-weight="900">32ms</text>
    <text x="505" y="155" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold">-14ms ↓</text>

    <rect x="610" y="85" width="280" height="110" rx="14" fill="#13192b" stroke="#1e293b" stroke-width="1"/>
    <text x="635" y="120" fill="#94a3b8" font-family="sans-serif" font-size="12">UPTIME SLA</text>
    <text x="635" y="160" fill="#a855f7" font-family="sans-serif" font-size="30" font-weight="900">99.98%</text>
    <text x="810" y="155" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold">ACTIVE</text>

    <!-- Large Interactive Chart Card -->
    <rect x="0" y="225" width="890" height="380" rx="18" fill="#111728" stroke="#1e293b" stroke-width="1"/>
    <text x="30" y="265" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Throughput &amp; Latency Timeline (30 Days)</text>
    
    <!-- Chart Grid Lines -->
    <line x1="30" y1="320" x2="860" y2="320" stroke="#1e293b" stroke-dasharray="4 4"/>
    <line x1="30" y1="390" x2="860" y2="390" stroke="#1e293b" stroke-dasharray="4 4"/>
    <line x1="30" y1="460" x2="860" y2="460" stroke="#1e293b" stroke-dasharray="4 4"/>
    <line x1="30" y1="530" x2="860" y2="530" stroke="#1e293b"/>

    <!-- Filled Area Chart -->
    <path d="M 50 500 Q 150 430, 250 470 T 450 360 T 650 320 T 840 280 L 840 530 L 50 530 Z" fill="url(#chartGrad)"/>
    <path d="M 50 500 Q 150 430, 250 470 T 450 360 T 650 320 T 840 280" fill="none" stroke="#a855f7" stroke-width="3.5"/>

    <!-- Cyan Secondary Comparison Line -->
    <path d="M 50 515 Q 180 490, 300 450 T 520 420 T 700 370 T 840 330" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-dasharray="5 3"/>

    <!-- Data Callout Marker -->
    <circle cx="650" cy="320" r="6" fill="#ffffff" stroke="#a855f7" stroke-width="4"/>
    <rect x="600" y="260" width="100" height="40" rx="8" fill="#1e1b4b" stroke="#a855f7" stroke-width="1"/>
    <text x="618" y="285" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">92.4k req/s</text>
  </g>
</svg>