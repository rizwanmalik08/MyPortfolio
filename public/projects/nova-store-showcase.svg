<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="novaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06070c"/>
      <stop offset="45%" stop-color="#0c0e17"/>
      <stop offset="100%" stop-color="#141724"/>
    </linearGradient>

    <!-- Accent Neon Gradients -->
    <linearGradient id="neonCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="neonGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131726"/>
      <stop offset="100%" stop-color="#0c0e17"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="novaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="750" fill="url(#novaBg)"/>

  <!-- High-Tech Coordinate Grid & Constellation Rays -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120" stroke-dasharray="4 8"/>
    <line x1="0" y1="260" x2="1200" y2="260" stroke-dasharray="4 8"/>
    <line x1="0" y1="420" x2="1200" y2="420" stroke-dasharray="4 8"/>
    <line x1="0" y1="580" x2="1200" y2="580" stroke-dasharray="4 8"/>
    <line x1="160" y1="0" x2="160" y2="750" stroke-dasharray="4 8"/>
    <line x1="400" y1="0" x2="400" y2="750" stroke-dasharray="4 8"/>
    <line x1="680" y1="0" x2="680" y2="750" stroke-dasharray="4 8"/>
    <line x1="940" y1="0" x2="940" y2="750" stroke-dasharray="4 8"/>
  </g>

  <!-- Ambient Glow Blobs -->
  <circle cx="820" cy="380" r="220" fill="#38bdf8" opacity="0.12" filter="url(#novaGlow)"/>
  <circle cx="340" cy="240" r="180" fill="#818cf8" opacity="0.10" filter="url(#novaGlow)"/>

  <!-- Browser Navigation Chrome Bar -->
  <rect width="1200" height="46" fill="#080a12" stroke="#1f2438" stroke-width="1"/>
  <circle cx="28" cy="23" r="5.5" fill="#f43f5e"/>
  <circle cx="46" cy="23" r="5.5" fill="#eab308"/>
  <circle cx="64" cy="23" r="5.5" fill="#10b981"/>
  
  <rect x="120" y="10" width="620" height="26" rx="6" fill="#121626" stroke="#252c48" stroke-width="1"/>
  <text x="140" y="27" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">🔒 https://localhost:5001/ — NOVA STORE | Interactive 3D Luxury Storefront</text>

  <rect x="1030" y="11" width="135" height="24" rx="12" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="1"/>
  <circle cx="1046" cy="23" r="3.5" fill="#10b981"/>
  <text x="1058" y="27" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1">LIVE DEMO 3D</text>

  <!-- Store Header Navigation -->
  <rect x="50" y="70" width="1100" height="64" rx="14" fill="#0c0e17" stroke="#1e2438" stroke-width="1"/>
  <rect x="70" y="86" width="32" height="32" rx="8" fill="url(#neonCyan)"/>
  <text x="80" y="108" fill="#000000" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="18">N</text>
  <text x="114" y="109" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="18" letter-spacing="2">NOVA<tspan fill="#38bdf8" font-weight="300">STORE</tspan></text>

  <text x="320" y="107" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="500">Home</text>
  <text x="390" y="107" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">Catalog</text>
  <text x="470" y="107" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="500">Electronics</text>
  <text x="570" y="107" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="500">Watches</text>
  <text x="655" y="107" fill="#818cf8" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">Admin</text>

  <!-- Right Actions: Cart & Account -->
  <rect x="980" y="84" width="70" height="36" rx="18" fill="#141724" stroke="#2b324d" stroke-width="1"/>
  <circle cx="1000" cy="102" r="5" fill="#38bdf8"/>
  <text x="1018" y="106" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">3</text>
  
  <rect x="1060" y="84" width="74" height="36" rx="18" fill="url(#neonCyan)"/>
  <text x="1082" y="107" fill="#000000" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">VIP</text>

  <!-- Left: Hero Headline & Brand Copy -->
  <g transform="translate(60, 175)">
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#38bdf8" opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
    <text x="12" y="16" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1.5">✦ THREE.JS 3D ENGINE</text>

    <text x="0" y="70" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
      Architectural Luxury
    </text>
    <text x="0" y="120" fill="url(#neonCyan)" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
      Crafted in Real-Time 3D
    </text>

    <text x="0" y="165" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="400">
      Full-stack luxury e-commerce with real-time WebGL orbit rendering,
    </text>
    <text x="0" y="188" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="400">
      material variations, SQLite database, cart validation, and admin portal.
    </text>

    <!-- Tech Stack Pills -->
    <g transform="translate(0, 225)">
      <rect x="0" y="0" width="90" height="28" rx="8" fill="#141724" stroke="#2c334d" stroke-width="1"/>
      <text x="14" y="18" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Three.js</text>

      <rect x="100" y="0" width="86" height="28" rx="8" fill="#141724" stroke="#2c334d" stroke-width="1"/>
      <text x="114" y="18" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Express</text>

      <rect x="196" y="0" width="80" height="28" rx="8" fill="#141724" stroke="#2c334d" stroke-width="1"/>
      <text x="210" y="18" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">SQLite</text>

      <rect x="286" y="0" width="94" height="28" rx="8" fill="#141724" stroke="#2c334d" stroke-width="1"/>
      <text x="298" y="18" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">REST API</text>
    </g>

    <!-- CTA Button -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="180" height="46" rx="14" fill="url(#neonCyan)"/>
      <text x="32" y="28" fill="#000000" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="14">Launch 3D Studio ↗</text>

      <rect x="195" y="0" width="140" height="46" rx="14" fill="#141724" stroke="#2c334d" stroke-width="1"/>
      <text x="220" y="28" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="14">View Catalog</text>
    </g>
  </g>

  <!-- Right: 3D Interactive Viewer Showcase Box -->
  <g transform="translate(620, 160)">
    <!-- Box Shadow & Card -->
    <rect x="0" y="0" width="510" height="380" rx="22" fill="url(#cardGrad)" stroke="#262d47" stroke-width="1.5"/>
    <rect x="0" y="0" width="510" height="380" rx="22" fill="none" stroke="url(#neonCyan)" stroke-width="1" opacity="0.4"/>

    <!-- 3D Orbit Coordinate Rings -->
    <ellipse cx="255" cy="180" rx="190" ry="85" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" stroke-dasharray="6 6"/>
    <ellipse cx="255" cy="180" rx="130" ry="170" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.25" stroke-dasharray="4 8"/>
    
    <!-- Stylized 3D Headphones Graphic Representation -->
    <!-- Headband Arc -->
    <path d="M 160 190 C 160 90, 350 90, 350 190" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" filter="url(#subtleGlow)"/>
    <path d="M 160 190 C 160 90, 350 90, 350 190" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>

    <!-- Left Ear Cup (Silver & Cyan Metallic) -->
    <rect x="140" y="170" width="40" height="70" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <ellipse cx="160" cy="205" rx="12" ry="24" fill="#0f172a"/>
    <circle cx="160" cy="205" r="5" fill="#38bdf8"/>

    <!-- Right Ear Cup -->
    <rect x="330" y="170" width="40" height="70" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <ellipse cx="350" cy="205" rx="12" ry="24" fill="#0f172a"/>
    <circle cx="350" cy="205" r="5" fill="#38bdf8"/>

    <!-- Contact Shadow underneath -->
    <ellipse cx="255" cy="285" rx="120" ry="16" fill="#000000" opacity="0.6"/>

    <!-- 3D Hint Badge -->
    <rect x="20" y="20" width="150" height="26" rx="13" fill="#080a12" opacity="0.8" stroke="#1f263d" stroke-width="1"/>
    <text x="32" y="37" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">✦ DRAG TO ROTATE 360°</text>

    <!-- Material Swatches Overlay Floating in 3D Box -->
    <rect x="140" y="325" width="230" height="38" rx="19" fill="#0a0c16" stroke="#252b42" stroke-width="1"/>
    <circle cx="170" cy="344" r="10" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="205" cy="344" r="10" fill="#d4af37" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
    <circle cx="240" cy="344" r="10" fill="#94a3b8" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
    <circle cx="275" cy="344" r="10" fill="#3b82f6" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
    <circle cx="310" cy="344" r="10" fill="#f43f5e" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
    <text x="335" y="348" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">PBR</text>
  </g>

  <!-- Bottom Mini Cards Grid -->
  <g transform="translate(50, 560)">
    <!-- Card 1: Dynamic Pricing -->
    <rect x="0" y="0" width="260" height="150" rx="16" fill="#0d101c" stroke="#1c2238" stroke-width="1"/>
    <text x="20" y="32" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">SERVER-SIDE PRICING</text>
    <text x="20" y="60" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16">Tamper-Proof Logic</text>
    <text x="20" y="85" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="12">Prices &amp; inventories are verified directly</text>
    <text x="20" y="103" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="12">on Node backend. Never trust client.</text>
    <rect x="20" y="118" width="60" height="18" rx="4" fill="#10b981" opacity="0.15"/>
    <text x="26" y="131" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">ACTIVE</text>

    <!-- Card 2: Interactive Catalog -->
    <rect x="280" y="0" width="260" height="150" rx="16" fill="#0d101c" stroke="#1c2238" stroke-width="1"/>
    <text x="300" y="32" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">13 LUXURY PRODUCTS</text>
    <text x="300" y="60" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16">6 Seeded Categories</text>
    <text x="300" y="85" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="12">Electronics, Watches, Fashion, Home,</text>
    <text x="300" y="103" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="12">Lifestyle &amp; Accessories with reviews.</text>
    <rect x="300" y="118" width="70" height="18" rx="4" fill="#818cf8" opacity="0.15"/>
    <text x="306" y="131" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">FILTERABLE</text>

    <!-- Card 3: Real Database -->
    <rect x="560" y="0" width="260" height="150" rx="16" fill="#0d101c" stroke="#1c2238" stroke-width="1"/>
    <text x="580" y="32" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">NATIVE SQLITE DB</text>
    <text x="580" y="60" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16">Real Persistence</text>
    <text x="580" y="85" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="12">11 Relational tables for orders, carts,</text>
    <text x="580" y="103" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="12">vouchers, accounts, and telemetry.</text>
    <rect x="580" y="118" width="60" height="18" rx="4" fill="#34d399" opacity="0.15"/>
    <text x="586" y="131" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">SQLITE 3</text>

    <!-- Card 4: Executive Admin -->
    <rect x="840" y="0" width="260" height="150" rx="16" fill="#0d101c" stroke="#1c2238" stroke-width="1"/>
    <text x="860" y="32" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">ADMIN CONTROL</text>
    <text x="860" y="60" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16">Live Storefront Portal</text>
    <text x="860" y="85" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="12">Real-time KPI metrics, order status</text>
    <text x="860" y="103" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="12">updates, product CRUD, and coupons.</text>
    <rect x="860" y="118" width="70" height="18" rx="4" fill="#f59e0b" opacity="0.15"/>
    <text x="866" y="131" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">SECURE RBAC</text>
  </g>
</svg>
