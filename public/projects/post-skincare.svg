<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="skinBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141c19"/>
      <stop offset="50%" stop-color="#0d1412"/>
      <stop offset="100%" stop-color="#080c0b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#skinBg)"/>

  <!-- Aesthetic Editorial Frame -->
  <rect x="70" y="70" width="940" height="940" fill="none" stroke="#223630" stroke-width="1.5"/>

  <!-- Brand Heading -->
  <text x="540" y="170" fill="url(#gold)" font-family="serif" font-size="24" letter-spacing="8" text-anchor="middle">BOTANICAL LABS • PARIS</text>
  <text x="540" y="270" fill="#f0fdf4" font-family="serif" font-size="68" font-weight="300" letter-spacing="3" text-anchor="middle">L'ÉLIXIR PUR</text>
  <text x="540" y="320" fill="#86efac" font-family="monospace" font-size="14" letter-spacing="6" text-anchor="middle">REVITALIZING CELLULAR SERUM</text>

  <!-- Central Cosmetic Glass Bottle Render Mockup -->
  <g transform="translate(540, 560)">
    <!-- Glow Backdrop -->
    <circle cx="0" cy="0" r="190" fill="#10b981" opacity="0.15" filter="blur(40px)"/>
    
    <!-- Bottle Body Glass -->
    <rect x="-70" y="-120" width="140" height="260" rx="40" fill="#132a22" stroke="#34d399" stroke-width="2" stroke-opacity="0.6"/>
    <!-- Bottle Liquid Gradient -->
    <rect x="-55" y="-50" width="110" height="180" rx="25" fill="#047857" opacity="0.45"/>
    
    <!-- Dropper Pipette Neck -->
    <rect x="-30" y="-180" width="60" height="60" rx="8" fill="#1e2925" stroke="#d97706" stroke-width="1.5"/>
    <rect x="-20" y="-230" width="40" height="50" rx="16" fill="#374151"/>
    
    <!-- Bottle Label -->
    <rect x="-50" y="-30" width="100" height="110" rx="8" fill="#061a14" stroke="#d97706" stroke-width="1"/>
    <text x="0" y="0" fill="url(#gold)" font-family="serif" font-size="11" font-weight="bold" text-anchor="middle">BOTANICAL</text>
    <text x="0" y="22" fill="#ffffff" font-family="sans-serif" font-size="9" text-anchor="middle">VITAMIN C + B5</text>
    <text x="0" y="44" fill="#a7f3d0" font-family="monospace" font-size="8" text-anchor="middle">30ml • 1.0 fl oz</text>
  </g>

  <!-- 3 Clinical Key Benefits -->
  <g transform="translate(130, 840)">
    <rect x="0" y="0" width="240" height="85" rx="14" fill="#0c1714" stroke="#1f372e" stroke-width="1"/>
    <text x="120" y="38" fill="url(#gold)" font-family="serif" font-size="24" font-weight="bold" text-anchor="middle">98%</text>
    <text x="120" y="62" fill="#a7f3d0" font-family="sans-serif" font-size="11" text-anchor="middle">Deep Hydration</text>

    <rect x="290" y="0" width="240" height="85" rx="14" fill="#0c1714" stroke="#1f372e" stroke-width="1"/>
    <text x="410" y="38" fill="url(#gold)" font-family="serif" font-size="24" font-weight="bold" text-anchor="middle">3X</text>
    <text x="410" y="62" fill="#a7f3d0" font-family="sans-serif" font-size="11" text-anchor="middle">Radiance Boost</text>

    <rect x="580" y="0" width="240" height="85" rx="14" fill="#0c1714" stroke="#1f372e" stroke-width="1"/>
    <text x="700" y="38" fill="url(#gold)" font-family="serif" font-size="24" font-weight="bold" text-anchor="middle">100%</text>
    <text x="700" y="62" fill="#a7f3d0" font-family="sans-serif" font-size="11" text-anchor="middle">Vegan &amp; Clean</text>
  </g>

  <text x="540" y="980" fill="#4ade80" font-family="monospace" font-size="13" letter-spacing="4" text-anchor="middle">SWIPE TO VIEW CLINICAL RESULTS &gt;&gt;&gt;</text>
</svg>